# dsh-malko-prefs bundle layer.
#
# 1) mount the host half (settings + llama.cpp probe);
# 2) override each shipped agent preset with the SAME definition the running
#    dsh ships, retargeted at dsh-malko-prefs/compaction.
#
# The preset body is computed at load time by dsh-malko-prefs/preset-config
# from the installed @deepseek-ai/dsh-web-app/presets/<id>.patch.yml, so this
# bundle tracks the dsh version instead of freezing a copy of its presets.
# `!!js` is the Loader's expression dialect; `baseUrl` is the profile root.
- insert:
    - id: malko-prefs
      name: 'dsh-malko-prefs'
- id: preset-cordis
  name: 'dsh-malko-prefs/preset'
  config: !!js process.getBuiltinModule('node:module').createRequire(baseUrl)('dsh-malko-prefs/preset-config')('cordis', baseUrl, ctx)
- id: preset-minimal
  name: 'dsh-malko-prefs/preset'
  config: !!js process.getBuiltinModule('node:module').createRequire(baseUrl)('dsh-malko-prefs/preset-config')('minimal', baseUrl, ctx)
- id: preset-ptc
  name: 'dsh-malko-prefs/preset'
  config: !!js process.getBuiltinModule('node:module').createRequire(baseUrl)('dsh-malko-prefs/preset-config')('ptc', baseUrl, ctx)
- id: preset-standard
  name: 'dsh-malko-prefs/preset'
  config: !!js process.getBuiltinModule('node:module').createRequire(baseUrl)('dsh-malko-prefs/preset-config')('standard', baseUrl, ctx)
